# Deploys this application. Runs on every push to main -- including the first one, which
# is what creates the frontend branch. There is no separate "first deployment" performed
# anywhere else.
#
# Generated by the Quorq AI SDLC platform. It authenticates with no secret stored in this
# repository: GitHub issues a short-lived OIDC token and AWS trusts that token only when it
# comes from this repository. There is nothing here to leak.
#
# The role it assumes can only touch this project's own resources -- its image repository,
# its frontend branch, and one parameter holding its database address. It cannot reach any
# other project, and it cannot reach the host the backend actually runs on: the platform's
# own backend process, not this workflow, pulls and runs the image this job pushes.
#
# Edit freely: it is your repository.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/sdlc/**'
  workflow_dispatch:

permissions:
  # Required for OIDC. Without it the credential step fails with a confusing "not
  # authorized to perform sts:AssumeRoleWithWebIdentity".
  id-token: write
  contents: read

concurrency:
  # Never two deploys of this app at once: two commits racing to publish the same Amplify
  # branch would step on each other's upload.
  group: deploy-p174f74c26009
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  IMAGE: 497511975196.dkr.ecr.us-east-1.amazonaws.com/aisdlc-174f74c26009
  AMPLIFY_APP: d13el1ykvx8z63
  BRANCH: p174f74c26009
  # false for a frontend-only project: there is no backend/ to build and no image to push.
  HAS_API: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497511975196:role/aisdlc-174f74c26009-github
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        if: env.HAS_API == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
        env:
          # Baked in at build time: the bundler inlines this into the bundle, so one built
          # without it calls localhost from whatever browser opens it. This is a fixed
          # address on the platform's own host, known ahead of time -- not discovered here
          # the way an AWS-assigned hostname would have to be. The variable name is the
          # frontend's own, because a bundler inlines only its own prefix.
          VITE_API_BASE_URL: https://54-166-99-17.sslip.io/apps/174f74c26009/
          NEXT_PUBLIC_API_SECRET_KEY: "174f74c2-6009-4dd8-adb2-4a03cbf7c8ed"
          VITE_API_SECRET_KEY: "174f74c2-6009-4dd8-adb2-4a03cbf7c8ed"

      - name: Deploy the frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          # One Amplify app holds every project, one branch each. The branch is what this
          # project owns, and what gives it its own hostname.
          aws amplify get-branch --app-id "$AMPLIFY_APP" --branch-name "$BRANCH" >/dev/null 2>&1 \
            || aws amplify create-branch --app-id "$AMPLIFY_APP" --branch-name "$BRANCH" >/dev/null

          cd dist && zip -rq ../bundle.zip . && cd ..
          RESPONSE=$(aws amplify create-deployment --app-id "$AMPLIFY_APP" --branch-name "$BRANCH")
          JOB=$(echo "$RESPONSE" | python3 -c "import sys,json;print(json.load(sys.stdin)['jobId'])")
          UPLOAD=$(echo "$RESPONSE" | python3 -c "import sys,json;print(json.load(sys.stdin)['zipUploadUrl'])")
          # A presigned upload, so no S3 bucket policy is involved.
          curl -fsS -X PUT -H 'Content-Type: application/zip' --upload-file bundle.zip "$UPLOAD"
          aws amplify start-deployment --app-id "$AMPLIFY_APP" --branch-name "$BRANCH" \
            --job-id "$JOB" >/dev/null

          # Amplify publishes in the background. Wait for it: the platform reports this
          # deployment live when this run succeeds, so success must mean the site is
          # serving the new bundle, not that the upload was accepted.
          STATUS=PENDING
          for _ in $(seq 1 90); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP" --branch-name "$BRANCH" \
              --job-id "$JOB" --query 'job.summary.status' --output text)
            case "$STATUS" in
              SUCCEED) break ;;
              FAILED|CANCELLED)
                echo "Amplify could not publish the frontend (job $JOB: $STATUS)." >&2
                exit 1 ;;
            esac
            sleep 10
          done
          if [ "$STATUS" != "SUCCEED" ]; then
            echo "Amplify was still publishing the frontend after 15 minutes (job $JOB)." >&2
            exit 1
          fi

          echo "Frontend: https://${BRANCH}.${AMPLIFY_APP}.amplifyapp.com"
          echo "API:      https://54-166-99-17.sslip.io/apps/174f74c26009/"
